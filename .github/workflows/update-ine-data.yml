name: Update INE Housing Data

on:
  # Run quarterly - 24th of Jan, Apr, Jul, Nov at 16:00 UTC
  schedule:
    - cron: '30 11 24 1,4,7,10 *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'
          use-public-rspm: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Install R packages
        run: |
          install.packages(c('httr', 'jsonlite'), repos='https://cloud.r-project.org', dependencies=TRUE)
        shell: Rscript {0}

      - name: Run INE data extraction
        run: Rscript download_ine.R

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain dados_ine*.json trimestres/) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dados_ine*.json trimestres/
          git add -u  # Stage deletions of old files
          git commit -m "Update INE housing data - $(date +'%Y-%m-%d')"
          git push

      - name: Update visualization repo
        if: always()
        run: |
          # Run scripts here in ine-habitacao (where all their input/output files live)
          Rscript transform_ine_to_geojson.R
          node consolidate_freguesias.js
          # Now clone the visualization repo
          cd ..
          git clone https://${{ secrets.CROSS_REPO_TOKEN }}@github.com/publico-data/preco-m2-habitacao.git
          cd preco-m2-habitacao
          # Copy outputs from ine-habitacao
          cp ../ine-habitacao/dados_ine_combined.json src/data/
          cp ../ine-habitacao/geojson_compras_updated.json src/data/
          # Commit and push if there are changes
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/dados_ine_combined.json src/data/geojson_compras_updated.json
          if git diff --staged --quiet; then
            echo "No changes to commit in visualization repo"
          else
            git commit -m "Update INE data and regenerate GeoJSON - $(date +'%Y-%m-%d')"
            git push
          fi
