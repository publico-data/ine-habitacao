name: Update INE Housing Data

on:
  # Run quarterly - 3rd of Feb, May, Aug, Nov at 16:00 UTC
  schedule:
    - cron: '0 16 3 2,5,8,11 *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Install R packages
        run: |
          install.packages(c("httr", "jsonlite"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Run INE data extraction
        run: Rscript download_ine.R

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain dados_ine*.json) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dados_ine*.json
          git add -u  # Stage deletions of old files
          git commit -m "Update INE housing data - $(date +'%Y-%m-%d')"
          git push
