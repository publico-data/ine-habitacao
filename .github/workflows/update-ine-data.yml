name: Update INE Housing Data

on:
  # Run quarterly - 3rd of Feb, May, Aug, Nov at 16:00 UTC
  schedule:
    - cron: '0 16 3 2,5,8,11 *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Install R packages
        run: |
          R -e "install.packages(c('httr', 'jsonlite'), repos='https://cloud.r-project.org')"

      - name: Run INE data extraction
        run: Rscript download_ine.R

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain dados_ine*.json trimestres/) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dados_ine*.json trimestres/
          git add -u  # Stage deletions of old files
          git commit -m "Update INE housing data - $(date +'%Y-%m-%d')"
          git push

      - name: Update visualization repo
        if: steps.check_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          # Clone the preco-m2-habitacao repo using token
          cd ..
          git clone https://x-access-token:${GH_TOKEN}@github.com/publico-data/preco-m2-habitacao.git
          cd preco-m2-habitacao

          # Copy the updated combined file
          cp ../ine-habitacao/dados_ine_combined.json src/data/

          # Run the transformation script to regenerate geojson
          Rscript transform_ine_to_geojson.R

          # Commit and push if there are changes
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/dados_ine_combined.json src/data/geojson_compras_updated.json
          git diff --staged --quiet || git commit -m "Update INE data and regenerate GeoJSON - $(date +'%Y-%m-%d')"
          git push
